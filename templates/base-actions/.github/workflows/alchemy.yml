# Runs the setup stack in alchemy.run.ts. Cloudflare Workers Builds deploys
# the app on every push; this workflow only applies the setup around it: the
# Worker shell, the Workers Builds link and its build variables, and the
# Convex project and deploy keys.
#
# - Pull request that changes the stack: a plan and a drift report,
#   read-only, as a check.
# - Push to main that changes the stack: a deploy. It compares against the
#   live providers (--detect-drift), so a deleted key or a changed setting is
#   repaired, not only a changed stack. The deploy that creates the Workers
#   Builds link also starts the first production build.
# - Run workflow on main: the same deploy. With `adopt`, the deploy takes over
#   resources that exist but are not in the state yet. With
#   `<owner>/<repository>` typed in the confirm field, scripts/destroy-app.ts
#   destroys the app instead: the Worker with its Previews, the Convex project
#   with all its deployments, and the stack's state. Any other confirm value
#   or branch runs nothing.
#
# A pull request from a fork gets no secrets, so its plan does not run.
#
# Each job installs without lifecycle scripts and audits the packages before
# any credential is in use. Each credential goes only to the steps that need
# it.
#
# State is Alchemy's Cloudflare state store. With --yes, the first deploy in a
# Cloudflare account creates the store, and a deploy upgrades an old store.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CONVEX_ACCESS_TOKEN
# (a Convex team access token). Variable: CONVEX_TEAM_ID (the numeric id of
# that Convex team).
name: alchemy

on:
  pull_request:
    paths:
      - alchemy.run.ts
      - cloudflare.config.ts
      - wrangler.config.ts
      - scripts/deploy-names.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/alchemy.yml
  push:
    branches: [main]
    paths:
      - alchemy.run.ts
      - cloudflare.config.ts
      - wrangler.config.ts
      - scripts/deploy-names.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/alchemy.yml
  workflow_dispatch:
    inputs:
      adopt:
        description: "Adopt resources that exist but are not in the state yet"
        type: boolean
        default: false
      confirm:
        description: "Type owner/repository to destroy the app instead: the Worker, the Convex project with all its deployments, and the stack state"
        required: false
        type: string

permissions:
  contents: read

# One run at a time. Pending runs wait instead of replacing each other, so a
# pull request plan never drops a queued deploy, and a destroy waits for a
# running or queued deploy.
concurrency:
  group: alchemy
  queue: max
  cancel-in-progress: false

# No secrets here: the steps that need them set them.
env:
  CI: "true"
  CONVEX_TEAM_ID: ${{ vars.CONVEX_TEAM_ID }}

jobs:
  plan:
    # A repository without the deploy setup, such as the published copy of
    # this template, has no CONVEX_TEAM_ID variable and no secrets, so it
    # skips the jobs. An unset variable is an empty string.
    if: vars.CONVEX_TEAM_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      # No install scripts and no credentials, so no dependency code runs with secrets before the audits pass.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

      # Read-only. The stack reads the GitHub ids and the default branch of
      # this repository from the GitHub API.
      - name: Plan the stack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec alchemy plan --stage prod --no-input --detailed

      # Read-only: reports resources that changed outside the stack.
      - name: Report drift
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec alchemy drift --stage prod --no-input

  deploy:
    # A push to main, or a run of the workflow on the default branch with no
    # confirm value. Skipped without CONVEX_TEAM_ID, like the plan.
    if: vars.CONVEX_TEAM_ID != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == '' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      # No install scripts and no credentials, so no dependency code runs with secrets before the audits pass.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

      # The deploy that creates the Workers Builds link also starts the first
      # production build (FirstBuild in alchemy.run.ts): Samebase pushes the
      # starter before this workflow creates the link, so no push builds it.
      - name: Deploy the stack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec alchemy deploy --stage prod --yes --no-input --detect-drift ${{ inputs.adopt && '--adopt' || '' }}

  destroy-app:
    # Runs only on the default branch, and only when the confirm input is this
    # repository. GitHub compares the two strings without regard to case. A
    # wrong value or another branch skips the job, so nothing runs.
    if: vars.CONVEX_TEAM_ID != '' && github.event_name == 'workflow_dispatch' && inputs.confirm == github.repository && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      # No install scripts and no credentials, so no dependency code runs with secrets before the audit passes.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The vulnerability audits of the deploy job protect the deploy, not the
      # cleanup, so a new advisory cannot block a destroy.
      - name: Audit package signatures
        run: pnpm audit signatures

      # A dry run that upgrades the state store, a deploy of the Worker shell
      # and the Convex project with DESTROY_APP=true, `alchemy destroy --stage
      # prod`, then the delete of the stack's state. scripts/destroy-app.ts
      # says why and in what order.
      - name: Destroy the app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
        run: node ./scripts/destroy-app.ts
