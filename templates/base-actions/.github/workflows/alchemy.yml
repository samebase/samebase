# Deploys the app with Alchemy (alchemy.run.ts). GitHub Actions runs the
# build: there is no Workers Builds trigger.
#
# - Push to main: `alchemy deploy --stage prod`.
# - Pull request opened, synchronize, reopened: `alchemy deploy --stage
#   <branch>`, where the stage is the branch name made safe by
#   scripts/alchemy-stage.ts and PREVIEW_BRANCH is the branch itself. A Convex
#   preview deployment named after the branch plus a Worker Preview of the
#   prod Worker named after the stage. The stack posts the preview URL as a
#   pull request comment.
# - Pull request closed: `alchemy destroy --stage <branch>`.
#
# State is Alchemy's Cloudflare state store. With --yes, the first deploy in a
# Cloudflare account creates the store, and a deploy upgrades an old store.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CONVEX_ACCESS_TOKEN
# (a Convex team access token). Variable: CONVEX_TEAM_ID (the numeric id of
# that Convex team).
name: alchemy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# One run per ref at a time. Pending runs wait instead of replacing each
# other, so a pull request close waits for its running deploy.
concurrency:
  group: alchemy-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  CI: "true"
  # The pull request branch; empty on a push. scripts/alchemy-stage.ts derives
  # STAGE from it, and alchemy.run.ts names the Convex preview after it.
  PREVIEW_BRANCH: ${{ github.head_ref }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
  CONVEX_TEAM_ID: ${{ vars.CONVEX_TEAM_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Read by GitHub.GitHubEnv in alchemy.run.ts. Empty on push.
  PULL_REQUEST: ${{ github.event.number }}

jobs:
  deploy:
    # Forks get no secrets, so they cannot deploy.
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node ./scripts/alchemy-stage.ts
      - run: pnpm exec alchemy deploy --stage "$STAGE" --yes --no-input

  destroy:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node ./scripts/alchemy-stage.ts
      - name: Destroy the pull request stage
        # The stage script fails on prod and on an empty name. The guard keeps
        # a destroy away from prod if that script ever changes.
        run: |
          case "$STAGE" in ""|prod) echo "Refusing to destroy '$STAGE'"; exit 1 ;; esac
          pnpm exec alchemy destroy --stage "$STAGE" --yes --no-input
