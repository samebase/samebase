name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Select current verified commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "${current_sha}" != "${VERIFIED_SHA}" ]; then
            echo "current=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "current=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout verified commit
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.source.outputs.current == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Select unpublished stable version
        id: version
        if: steps.source.outputs.current == 'true'
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [ "${package_name}" != "@samebase/sidebars" ]; then
            echo "Unexpected package name: ${package_name}" >&2
            exit 1
          fi

          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Skip non-stable version ${package_version}."
            exit 0
          fi

          lookup_log="${RUNNER_TEMP}/npm-view.log"
          if npm view "${package_name}@${package_version}" version \
            --registry https://registry.npmjs.org/ >"${lookup_log}" 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Skip existing version ${package_version}."
            exit 0
          fi

          if ! grep -q "E404" "${lookup_log}"; then
            cat "${lookup_log}" >&2
            exit 1
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: package.json
          version: 11.18.0

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish stable package
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --tag latest --registry https://registry.npmjs.org/
