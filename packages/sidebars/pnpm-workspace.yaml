packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Reviewed security fix: https://github.com/7rulnik/source-map-js/pull/79
  # Remove after 2026-10-07, when the 7-day cooling period is complete.
  - "source-map-js@1.2.2"
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # this trust-downgraded version.
  - "undici-types@6.21.0"
overrides:
  source-map-js: 1.2.2
  tinypool: 2.2.0
  undici: 8.11.2
allowBuilds:
  esbuild: true
