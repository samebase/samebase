packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions. This gives the
# ecosystem time to detect and yank compromised releases before CI can install
# them.
minimumReleaseAge: 10080
# Keep release-age exceptions exact so future Convex releases do not bypass the
# cooling period automatically.
minimumReleaseAgeExclude:
  # TODO(2026-06-20): Remove the esbuild@0.28.1 and @esbuild/*@0.28.1
  # release-age exceptions after the normal 7-day cooling period has passed. Keep
  # the esbuild override below until `pnpm why esbuild --recursive` shows upstream
  # packages no longer need the transitive pin.
  - "@esbuild/aix-ppc64@0.28.1"
  - "@esbuild/android-arm@0.28.1"
  - "@esbuild/android-arm64@0.28.1"
  - "@esbuild/android-x64@0.28.1"
  - "@esbuild/darwin-arm64@0.28.1"
  - "@esbuild/darwin-x64@0.28.1"
  - "@esbuild/freebsd-arm64@0.28.1"
  - "@esbuild/freebsd-x64@0.28.1"
  - "@esbuild/linux-arm@0.28.1"
  - "@esbuild/linux-arm64@0.28.1"
  - "@esbuild/linux-ia32@0.28.1"
  - "@esbuild/linux-loong64@0.28.1"
  - "@esbuild/linux-mips64el@0.28.1"
  - "@esbuild/linux-ppc64@0.28.1"
  - "@esbuild/linux-riscv64@0.28.1"
  - "@esbuild/linux-s390x@0.28.1"
  - "@esbuild/linux-x64@0.28.1"
  - "@esbuild/netbsd-arm64@0.28.1"
  - "@esbuild/netbsd-x64@0.28.1"
  - "@esbuild/openbsd-arm64@0.28.1"
  - "@esbuild/openbsd-x64@0.28.1"
  - "@esbuild/openharmony-arm64@0.28.1"
  - "@esbuild/sunos-x64@0.28.1"
  - "@esbuild/win32-arm64@0.28.1"
  - "@esbuild/win32-ia32@0.28.1"
  - "@esbuild/win32-x64@0.28.1"
  # TODO(2026-06-17): Remove the protobufjs@7.6.3 release-age exception after
  # the normal 7-day cooling period has passed.
  - convex@1.40.0
  # TODO(2026-06-18): Remove the dompurify@3.4.9 release-age exception after
  # the normal 7-day cooling period has passed. Keep the dompurify override
  # below until upstream packages no longer resolve vulnerable DOMPurify
  # versions.
  - dompurify@3.4.9
  - esbuild@0.28.1
  - protobufjs@7.6.3
  - qs@6.15.2
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Blocks transitive git/tarball dependencies, including the remote GitHub
# optional dependency path used in the TanStack compromise.
blockExoticSubdeps: true
# Rejects releases whose registry trust evidence is weaker than prior releases.
trustPolicy: no-downgrade
overrides:
  "@babel/core": 7.29.7
  "@protobufjs/utf8": 1.1.1
  "ajv@6": 6.15.0
  "ajv@8": 8.18.0
  "brace-expansion@1": 1.1.13
  "brace-expansion@5": 5.0.6
  dompurify: 3.4.9
  esbuild: 0.28.1
  fast-uri: 3.1.2
  flatted: 3.4.2
  hono: 4.12.21
  ip-address: 10.1.1
  js-yaml: 4.2.0
  mailparser: 3.9.8
  "minimatch@3": 3.1.5
  "picomatch@2": 2.3.2
  "picomatch@4.0.3": 4.0.4
  postcss: 8.5.10
  protobufjs: 7.6.3
  qs: 6.15.2
  "semver@6": 7.7.4
  shell-quote: 1.8.4
  vite: 8.0.16
  ws: 8.21.0
# Every dependency lifecycle script is reviewed explicitly. `true` allows the
# script to run; `false` records that the script was seen and suppressed.
allowBuilds:
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: false
  workerd: true
patchedDependencies:
  ajv@8.18.0: patches/ajv@8.18.0.patch
