packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions. This gives the
# ecosystem time to detect and yank compromised releases before CI can install
# them.
minimumReleaseAge: 10080
# Keep release-age exceptions exact so future package releases do not bypass
# the cooling period automatically.
minimumReleaseAgeExclude:
  # TODO(2026-08-06): Remove after this security patch completes the normal
  # 7-day cooling period.
  - brace-expansion@5.0.9
  # TODO(2026-08-10): Remove after this security patch completes the normal
  # 7-day cooling period.
  - dompurify@3.4.13
  # TODO(2026-08-07): Remove after this security patch completes the normal
  # 7-day cooling period.
  - fast-uri@3.1.5
  # TODO(2026-08-07): Remove after this security patch completes the normal
  # 7-day cooling period.
  - ip-address@10.3.1
  # TODO(2026-08-07): Remove after this security patch completes the normal
  # 7-day cooling period.
  - js-yaml@4.3.1
  # TODO(2026-08-10): Remove after this security patch completes the normal
  # 7-day cooling period.
  - hono@4.12.34
  # TODO(2026-08-14): Remove after this security patch completes the normal
  # 7-day cooling period.
  - nanoid@3.3.18
  # TODO(2026-08-07): Remove these Vite+ exceptions after the normal 7-day
  # cooling period has passed.
  - "@voidzero-dev/vite-plus-core@0.2.7"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.7"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.7"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.7"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.7"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.7"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.7"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.7"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.7"
  - vite-plus@0.2.7
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Blocks transitive git/tarball dependencies, including the remote GitHub
# optional dependency path used in the TanStack compromise.
blockExoticSubdeps: true
# Rejects releases whose registry trust evidence is weaker than prior releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # these trust-downgraded transitive versions.
  - reselect@5.1.1
  - undici-types@6.21.0
overrides:
  "@babel/core": 7.29.7
  "@hono/node-server": 2.0.10
  "@protobufjs/utf8": 1.1.1
  "ajv@6": 6.15.0
  "ajv@8": 8.18.0
  "brace-expansion@1": 5.0.9
  "brace-expansion@2": 5.0.9
  "brace-expansion@5": 5.0.9
  body-parser: 2.3.0
  dompurify: 3.4.13
  esbuild: 0.28.1
  fast-uri: 3.1.5
  flatted: 3.4.2
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  mailparser: 3.9.8
  "minimatch@3": 3.1.5
  nanoid: 3.3.18
  "picomatch@2": 2.3.2
  "picomatch@4.0.3": 4.0.4
  postcss: 8.5.23
  protobufjs: 7.6.3
  qs: 6.15.2
  sharp: 0.35.3
  "semver@6": 7.7.4
  shell-quote: 1.9.0
  undici: 7.29.0
  vite: "catalog:"
  ws: 8.21.0
  vitest: "catalog:"
# Every dependency lifecycle script is reviewed explicitly. `true` allows the
# script to run; `false` records that the script was seen and suppressed.
allowBuilds:
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: false
  workerd: true
patchedDependencies:
  "@convex-dev/auth@0.0.94": patches/@convex-dev__auth@0.0.94.patch
  ajv@8.18.0: patches/ajv@8.18.0.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vitest: 4.1.10
  vite-plus: 0.2.7
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
