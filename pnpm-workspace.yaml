packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions. This gives the
# ecosystem time to detect and yank compromised releases before CI can install
# them.
minimumReleaseAge: 10080
# Keep release-age exceptions exact so future Convex releases do not bypass the
# cooling period automatically.
minimumReleaseAgeExclude:
  # TODO(2026-07-01): Remove the convex@1.42.0 release-age exception after
  # the normal 7-day cooling period has passed.
  - convex@1.42.0
  # TODO(2026-06-25): Remove the dompurify@3.4.11 and undici@7.28.0 release-age
  # exceptions after the normal 7-day cooling period has passed. Keep the
  # overrides below until upstream packages no longer resolve vulnerable
  # versions.
  - dompurify@3.4.11
  - protobufjs@7.6.3
  - qs@6.15.2
  - undici@7.28.0
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Blocks transitive git/tarball dependencies, including the remote GitHub
# optional dependency path used in the TanStack compromise.
blockExoticSubdeps: true
# Rejects releases whose registry trust evidence is weaker than prior releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # these trust-downgraded transitive versions.
  - reselect@5.1.1
  - undici-types@6.21.0
overrides:
  "@babel/core": 7.29.7
  "@protobufjs/utf8": 1.1.1
  "ajv@6": 6.15.0
  "ajv@8": 8.18.0
  "brace-expansion@1": 1.1.13
  "brace-expansion@5": 5.0.6
  dompurify: 3.4.11
  esbuild: 0.28.1
  fast-uri: 3.1.2
  flatted: 3.4.2
  hono: 4.12.25
  ip-address: 10.1.1
  js-yaml: 4.2.0
  mailparser: 3.9.8
  "minimatch@3": 3.1.5
  "picomatch@2": 2.3.2
  "picomatch@4.0.3": 4.0.4
  postcss: 8.5.10
  protobufjs: 7.6.3
  qs: 6.15.2
  "semver@6": 7.7.4
  shell-quote: 1.8.4
  undici: 7.28.0
  vite: 8.0.16
  ws: 8.21.0
# Every dependency lifecycle script is reviewed explicitly. `true` allows the
# script to run; `false` records that the script was seen and suppressed.
allowBuilds:
  core-js: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: false
  workerd: true
patchedDependencies:
  ajv@8.18.0: patches/ajv@8.18.0.patch
