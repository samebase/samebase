packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions. This gives the
# ecosystem time to detect and yank compromised releases before CI can install
# them.
minimumReleaseAge: 10080
# Keep release-age exceptions exact so future package releases do not bypass
# the cooling period automatically.
minimumReleaseAgeExclude:
  # Reviewed Effect patch: https://github.com/Effect-TS/effect/releases/tag/effect%404.0.3
  # Approved for the Node adapter peer dependency. Remove after 2026-10-18
  # 12:58:30 UTC, when the 7-day cooling period is complete.
  - "effect@4.0.3"
  # Reviewed security fix: https://github.com/7rulnik/source-map-js/pull/79
  # Remove after 2026-10-07, when the 7-day cooling period is complete.
  - "source-map-js@1.2.2"
  # Reviewed security fix: https://github.com/advisories/GHSA-pqg4-j6r4-53mv
  # (shell-quote quote() command injection). Remove after 2026-10-09, when the
  # 7-day cooling period is complete.
  - "shell-quote@1.12.0"
  # Reviewed first-party releases. Remove after 2026-10-15.
  - "@samebase/convex-cloudflare-email-inbox@0.3.0"
  - "@samebase/convex-cloudflare-email-inbox-ui@0.1.0"
  # Reviewed first-party Alchemy provider (apps/samebase/alchemy.run.ts),
  # published 2026-10-05. Remove after 2026-10-13.
  - "@samebase/alchemy-convex@0.2.0"
  # Reviewed first-party release (apps/samebase serves samebase.com with it),
  # published 2026-10-18. Remove after 2026-10-25.
  - "@samebase/convex-hosting@0.13.1"
  # Reviewed first-party releases (apps/samebase renders its pages and keeps its sessions in
  # cookies with them, RFC 128), published 2026-10-20 10:48 UTC. Remove after 2026-10-27 10:49 UTC.
  - "@samebase/convex-hosting-tanstack-start@0.11.0"
  - "@samebase/convex-auth-tanstack-start@0.1.0"
  # Reviewed Convex Auth 2 beta (apps/samebase signs in with it, RFC 128), published
  # 2026-10-15 21:13 UTC. Remove after 2026-10-22 21:14 UTC.
  - "@convex-dev/auth@2.0.0-beta.0"
  # TODO(2026-08-31): Remove after Vite+ 0.3.0 completes the normal
  # 7-day cooling period.
  - "@voidzero-dev/vite-plus-core@0.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.0"
  - vite-plus@0.3.0
  # TODO(2026-09-06): Remove after qs 6.16.0 completes the normal
  # 7-day cooling period.
  - qs@6.16.0
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Blocks transitive git/tarball dependencies, including the remote GitHub
# optional dependency path used in the TanStack compromise.
blockExoticSubdeps: true
# Rejects releases whose registry trust evidence is weaker than prior releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # these trust-downgraded transitive versions.
  - reselect@5.1.1
  - undici-types@6.21.0
  # First-party: convex-hosting moved from staged approval to trusted publishing with provenance on
  # merge (samebase/convex-hosting#125), which pnpm ranks below the staged releases before it.
  - "@samebase/convex-hosting-tanstack-start@0.11.0"
audit:
  ignore:
    # TODO(2026-10-17): Remove once braces publishes a fix. No patched release
    # exists yet (latest is 3.0.3). braces only reaches build and dev tooling
    # through chokidar and micromatch, not shipped Worker code.
    - GHSA-vfj7-8cjw-p6xm
overrides:
  # Shared adapter 4.0.5 requires Effect ^4.0.5.
  "@effect/platform-node-shared": 4.0.4
  "@samebase/sidebars": "workspace:*"
  "@babel/core": 7.29.7
  "@hono/node-server": 2.1.5
  "@modelcontextprotocol/sdk": 1.31.0
  "@protobufjs/utf8": 1.1.2
  "ajv@6": 6.15.0
  "ajv@8": 8.20.0
  "brace-expansion@1": 5.0.12
  "brace-expansion@2": 5.0.12
  "brace-expansion@5": 5.0.12
  body-parser: 2.3.0
  browserslist: 4.29.3
  # GHSA-g5c8-w9fp-h5vm also affects the copy pinned by the mail component.
  convex-helpers: 0.1.128
  dompurify: 3.4.17
  esbuild: 0.28.2
  fast-uri: 3.1.8
  flatted: 3.4.4
  hono: 4.13.13
  ip-address: 10.7.4
  js-yaml: 4.3.2
  lodash: 4.18.1
  mailparser: 3.9.38
  "minimatch@3": 3.1.5
  nanoid: 3.3.20
  "picomatch@2": 2.3.2
  "picomatch@4.0.3": 4.0.7
  postcss: 8.5.30
  postcss-selector-parser: 7.1.6
  protobufjs: 7.6.6
  proxy-addr: 2.0.8
  qs: 6.16.0
  sharp: 0.35.5
  "semver@6": 7.8.5
  shell-quote: 1.12.0
  seroval: 1.6.9
  source-map-js: 1.2.2
  tinypool: 2.2.0
  undici: 7.30.0
  valibot: 1.5.0
  vite: "catalog:"
  ws: 8.22.0
  vitest: "catalog:"
# Every dependency lifecycle script is reviewed explicitly. `true` allows the
# script to run; `false` records that the script was seen and suppressed.
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 0.3.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  # Adds deleteUser to the Convex Auth 2 core and password components, which account deletion
  # calls. Remove when upstream ships deletion by user id.
  "@convex-dev/auth@2.0.0-beta.0": patches/@convex-dev__auth@2.0.0-beta.0.patch
