# templates/base is a separate workspace with its own lockfile.
packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions. This gives the
# ecosystem time to detect and yank compromised releases before CI can install
# them.
minimumReleaseAge: 10080
# Keep third-party exceptions exact so future releases do not bypass the
# cooling period automatically.
minimumReleaseAgeExclude:
  # Our own releases, which apps here may install as soon as they are published.
  - "@samebase/*"
  # Reviewed security fix: https://github.com/7rulnik/source-map-js/pull/79
  # Remove after 2026-10-07, when the 7-day cooling period is complete.
  - "source-map-js@1.2.2"
  # Reviewed security fix: https://github.com/advisories/GHSA-pqg4-j6r4-53mv
  # (shell-quote quote() command injection). Remove after 2026-10-09, when the
  # 7-day cooling period is complete.
  - "shell-quote@1.12.0"
  # Reviewed Convex Auth 2 beta (apps/samebase signs in with it, RFC 128), published
  # 2026-10-15 21:13 UTC. Remove after 2026-10-22 21:14 UTC.
  - "@convex-dev/auth@2.0.0-beta.0"
  # Alchemy 2.0.0-beta.84 with its provider packages @alchemy.run/cloudflare and @alchemy.run/github
  # (apps/samebase/alchemy.run.ts deploys samebase.com with them), and the @alchemy.run and @distilled.cloud
  # versions that they install. Published 2026-10-23 23:03 UTC to 2026-10-24 04:03 UTC. Remove
  # after 2026-10-31 04:03 UTC.
  - "alchemy@2.0.0-beta.84"
  - "@alchemy.run/acme@2.0.0-beta.84"
  - "@alchemy.run/cloudflare@2.0.0-beta.84"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.84"
  - "@alchemy.run/docker@2.0.0-beta.84"
  - "@alchemy.run/github@2.0.0-beta.84"
  - "@alchemy.run/node-utils@2.0.0-beta.84"
  - "@alchemy.run/sql@2.0.0-beta.84"
  - "@distilled.cloud/acme@1.0.0-rc.17"
  - "@distilled.cloud/aws4signer@1.0.0-rc.17"
  - "@distilled.cloud/cloudflare@1.0.0-rc.17"
  - "@distilled.cloud/core@1.0.0-rc.17"
  - "@distilled.cloud/iceberg@1.0.0-rc.17"
  # Reviewed release: the Convex CLI that @samebase/alchemy-convex 0.11.0 (peer ^1.48.0) pushes its
  # store with; the store signs its read tokens with the native JWT signing of 1.48.0. Published
  # 2026-10-22 23:32 UTC. Remove after 2026-10-29 23:33 UTC.
  - "convex@1.48.0"
  # Reviewed security fix: https://github.com/advisories/GHSA-p458-7748-mcp3
  # (Vitest servers serve files that server.fs.deny lists). Vite+ 1.3.0 and the Vitest 5.0.5 it
  # pins, published 2026-10-16 05:42 UTC with npm provenance. Remove after 2026-10-23 05:43 UTC.
  - "vite-plus@1.3.0"
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - "vitest@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  # Reviewed security fixes: https://github.com/advisories/GHSA-w74x-v6f9-j3xg,
  # GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h, and GHSA-333x-w4r6-6crp (fast-uri URI parsing), published
  # 2026-10-19 22:51 UTC with npm provenance. Remove after 2026-10-26 22:52 UTC.
  - "fast-uri@4.2.3"
  # Reviewed security fix: https://github.com/advisories/GHSA-27r3-jxmh-p828 (body-parser denial of
  # service via trailing bytes after a compressed body), published 2026-10-22 11:39 UTC with npm
  # provenance. Remove after 2026-10-29 11:40 UTC.
  - "body-parser@2.4.0"
  # Reviewed security fix: https://github.com/advisories/GHSA-f2hq-32vh-53cc (postal-mime quadratic
  # header decoding), published 2026-10-17 15:06 UTC with npm provenance. Remove after 2026-10-24
  # 15:07 UTC.
  - "postal-mime@4.0.8"
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Blocks transitive git/tarball dependencies, including the remote GitHub
# optional dependency path used in the TanStack compromise.
blockExoticSubdeps: true
# Rejects releases whose registry trust evidence is weaker than prior releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # these trust-downgraded transitive versions.
  - reselect@5.1.1
  - undici-types@6.21.0
  # First-party: convex-hosting moved from staged approval to trusted publishing with provenance on
  # merge (samebase/convex-hosting#125), which pnpm ranks below the staged releases before it.
  - "@samebase/convex-hosting-tanstack-start@0.11.0"
audit:
  ignore:
    # TODO(2026-10-17): Remove once braces publishes a fix. No patched release
    # exists yet (latest is 3.0.3). braces only reaches build and dev tooling
    # through chokidar and micromatch, not shipped Worker code.
    - GHSA-vfj7-8cjw-p6xm
    # TODO(2026-11-11): Remove once deepmerge publishes a fix. No patched release
    # exists yet (latest is 4.3.1). deepmerge only reaches the shadcn CLI, a
    # devDependency of apps/samebase, not shipped Worker code.
    - GHSA-gcqx-w48m-w2h4
    # TODO(2026-11-14): Remove once nothing resolves minimatch below 11.0.1, the first fixed release.
    # Minimatch 11 removes makeRe() and changes Minimatch.set, which breaks glob 7, so an override is
    # not safe. The flaw needs a crafted pattern and optimizationLevel 2 or higher. Our call in
    # apps/samebase/src/repository/editor/simpleView.ts and the packages that resolve minimatch use
    # the default, 1. The glob copy bundled in vite-plus uses 2, but only on patterns from this
    # repository's own config, and anyone who can edit those can already run code here.
    - GHSA-g3hv-75wg-m249
overrides:
  # Shared adapter 4.0.6 requires Effect ^4.0.6.
  "@effect/platform-node-shared": 4.0.5
  "@babel/core": 7.29.7
  "@hono/node-server": 2.1.5
  "@modelcontextprotocol/sdk": 1.32.1
  "@protobufjs/utf8": 1.1.2
  "ajv@6": 6.15.0
  "ajv@8": 8.20.0
  "brace-expansion@1": 5.0.12
  "brace-expansion@2": 5.0.12
  "brace-expansion@5": 5.0.12
  body-parser: 2.4.0
  browserslist: 4.29.3
  # GHSA-g5c8-w9fp-h5vm also affects the copy pinned by the mail component.
  convex-helpers: 0.1.128
  dompurify: 3.4.17
  esbuild: 0.28.2
  fast-uri: 4.2.3
  flatted: 3.4.4
  hono: 4.13.13
  ip-address: 10.7.4
  js-yaml: 5.4.3
  lodash: 4.18.1
  mailparser: 3.9.38
  "minimatch@3": 10.2.6
  nanoid: 6.0.2
  "picomatch@2": 4.0.7
  "picomatch@4.0.3": 4.0.7
  # GHSA-f2hq-32vh-53cc: the mail component declares postal-mime ^3, and no 3.x release has the fix.
  postal-mime: 4.0.8
  postcss: 8.5.30
  postcss-selector-parser: 7.1.6
  protobufjs: 8.8.1
  proxy-addr: 2.0.8
  qs: 6.16.1
  sharp: 0.35.5
  "semver@6": 7.8.5
  shell-quote: 1.12.0
  seroval: 1.6.12
  source-map-js: 1.2.2
  tinypool: 2.2.0
  undici: 8.12.2
  valibot: 1.5.0
  vite: "catalog:"
  ws: 8.22.0
  vitest: "catalog:"
  zod: 4.6.7
# Every dependency lifecycle script is reviewed explicitly. `true` allows the
# script to run; `false` records that the script was seen and suppressed.
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  # Adds deleteUser to the Convex Auth 2 core and password components, which account deletion
  # calls. Remove when upstream ships deletion by user id.
  "@convex-dev/auth@2.0.0-beta.0": patches/@convex-dev__auth@2.0.0-beta.0.patch
