# templates/base is a separate workspace with its own lockfile.
packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions. This gives the
# ecosystem time to detect and yank compromised releases before CI can install
# them.
minimumReleaseAge: 10080
# Keep release-age exceptions exact so future package releases do not bypass
# the cooling period automatically.
minimumReleaseAgeExclude:
  # Reviewed security fix: https://github.com/7rulnik/source-map-js/pull/79
  # Remove after 2026-10-07, when the 7-day cooling period is complete.
  - "source-map-js@1.2.2"
  # Reviewed security fix: https://github.com/advisories/GHSA-pqg4-j6r4-53mv
  # (shell-quote quote() command injection). Remove after 2026-10-09, when the
  # 7-day cooling period is complete.
  - "shell-quote@1.12.0"
  # Reviewed first-party release. Remove after 2026-10-09.
  - "@samebase/convex-cloudflare-email-inbox@0.1.0"
  # TODO(2026-08-31): Remove after Vite+ 0.3.0 completes the normal
  # 7-day cooling period.
  - "@voidzero-dev/vite-plus-core@0.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.0"
  - vite-plus@0.3.0
  # TODO(2026-09-06): Remove after qs 6.16.0 completes the normal
  # 7-day cooling period.
  - qs@6.16.0
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Blocks transitive git/tarball dependencies, including the remote GitHub
# optional dependency path used in the TanStack compromise.
blockExoticSubdeps: true
# Rejects releases whose registry trust evidence is weaker than prior releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # these trust-downgraded transitive versions.
  - reselect@5.1.1
  - undici-types@6.21.0
audit:
  ignore:
    # TODO(2026-10-17): Remove once braces publishes a fix. No patched release
    # exists yet (latest is 3.0.3). braces only reaches build and dev tooling
    # through chokidar and micromatch, not shipped Worker code.
    - GHSA-vfj7-8cjw-p6xm
overrides:
  "@samebase/sidebars": "workspace:*"
  "@babel/core": 7.29.7
  "@hono/node-server": 2.0.10
  "@protobufjs/utf8": 1.1.1
  "ajv@6": 6.15.0
  "ajv@8": 8.18.0
  "brace-expansion@1": 5.0.12
  "brace-expansion@2": 5.0.12
  "brace-expansion@5": 5.0.12
  body-parser: 2.3.0
  browserslist: 4.28.7
  dompurify: 3.4.16
  esbuild: 0.28.1
  fast-uri: 3.1.8
  flatted: 3.4.2
  hono: 4.13.7
  ip-address: 10.7.1
  js-yaml: 4.3.2
  mailparser: 3.9.8
  "minimatch@3": 3.1.5
  nanoid: 3.3.18
  "picomatch@2": 2.3.2
  "picomatch@4.0.3": 4.0.4
  postcss: 8.5.23
  postcss-selector-parser: 7.1.6
  protobufjs: 7.6.3
  proxy-addr: 2.0.8
  qs: 6.16.0
  sharp: 0.35.5
  "semver@6": 7.7.4
  shell-quote: 1.12.0
  seroval: 1.6.3
  source-map-js: 1.2.2
  tinypool: 2.1.2
  undici: 7.29.1
  vite: "catalog:"
  ws: 8.21.0
  vitest: "catalog:"
# Every dependency lifecycle script is reviewed explicitly. `true` allows the
# script to run; `false` records that the script was seen and suppressed.
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: false
  workerd: true
patchedDependencies:
  "@convex-dev/auth@0.0.94": patches/@convex-dev__auth@0.0.94.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  vite-plus: 0.3.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
