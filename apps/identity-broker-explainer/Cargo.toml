[package]
name = "identity-broker-explainer"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["metal"] }
fframes_native_player = { version = "=1.3.0", default-features = false, features = [
  "metal",
  "audio",
] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "identity_broker_explainer"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "identity-broker-explainer"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

