<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">How Samebase works</title>
  <desc id="desc">At setup, Samebase writes one secret, one variable and the starter into your repository. GitHub Actions runs alchemy deploy, which deploys your Convex project and writes state to the alchemy-state-store project on your team. Samebase reads that state over OAuth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#394447" />
    </marker>
    <marker id="read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00889f" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0c0a09; }
    .title { font-size: 21px; font-weight: 600; }
    .note { font-size: 16px; fill: #57534e; }
    .label { font-size: 16px; fill: #0c0a09; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .invert, .invert text { fill: #fafaf9; }
    .box { fill: #ffffff; stroke: #a8a29e; stroke-width: 1.5; }
    .inner { fill: #f5f5f4; stroke: #d6d3d1; stroke-width: 1; }
    .solid { fill: #394447; stroke: #394447; stroke-width: 1.5; }
    .edge { fill: none; stroke: #394447; stroke-width: 2; marker-end: url(#arrow); }
    .reads { fill: none; stroke: #00889f; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#read); }
    .readlabel { font-size: 16px; fill: #00707f; font-weight: 600; }
  </style>
  <rect width="960" height="460" fill="#ffffff" />

  <rect class="solid" x="30" y="40" width="290" height="110" />
  <g class="invert">
    <text class="title" x="50" y="82">Samebase</text>
    <text x="50" y="114" font-size="16">starts apps, monitors them</text>
  </g>

  <rect class="box" x="30" y="250" width="290" height="180" />
  <text class="title" x="50" y="290">Your repository</text>
  <rect class="inner" x="50" y="306" width="250" height="44" />
  <text class="mono" x="65" y="333">alchemy.run.ts</text>
  <rect class="inner" x="50" y="362" width="250" height="52" />
  <text class="label" x="65" y="384">GitHub Actions</text>
  <text class="mono" x="65" y="404">alchemy deploy</text>

  <rect class="box" x="620" y="30" width="310" height="400" />
  <text class="title" x="640" y="68">Your Convex team</text>
  <rect class="inner" x="640" y="84" width="270" height="86" />
  <text class="mono" x="655" y="116">alchemy-state-store</text>
  <text class="note" x="655" y="146">what you deployed</text>
  <rect class="inner" x="640" y="222" width="270" height="188" />
  <text class="mono" x="655" y="254">my-app</text>
  <text class="note" x="655" y="282">database, functions, site</text>
  <rect class="box" x="655" y="300" width="240" height="40" />
  <text class="mono" x="670" y="325">prod</text>
  <rect class="box" x="655" y="352" width="240" height="40" />
  <text class="mono" x="670" y="377">pr-42</text>

  <path class="reads" d="M 320 112 L 634 112" />
  <text class="readlabel" x="335" y="100">reads state over OAuth</text>

  <path class="edge" d="M 120 150 L 120 244" />
  <text class="label" x="134" y="186">at setup: one secret,</text>
  <text class="label" x="134" y="210">one variable, the starter</text>

  <path class="edge" d="M 320 372 L 634 156" />
  <text class="label" x="372" y="258">writes state</text>

  <path class="edge" d="M 320 398 L 634 398" />
  <text class="label" x="335" y="386">deploys on each push</text>
</svg>
