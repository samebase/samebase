packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Reviewed security fix: https://github.com/7rulnik/source-map-js/pull/79
  # Remove after 2026-10-07, when the 7-day cooling period is complete.
  - "source-map-js@1.2.2"
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-07-10): Recheck once upstream dependencies no longer resolve
  # this trust-downgraded version.
  - "undici-types@6.21.0"
audit:
  ignore:
    # TODO(2026-10-17): Remove once braces publishes a fix. No patched release
    # exists yet (latest is 3.0.3). braces only reaches build and dev tooling
    # through chokidar, not shipped Worker code.
    - GHSA-vfj7-8cjw-p6xm
overrides:
  esbuild: 0.28.2
  js-yaml: 5.4.3
  "semver@6": 7.8.5
  seroval: 1.6.9
  sharp: 0.35.5
  source-map-js: 1.2.2
  tinypool: 2.2.0
  undici: 8.11.2
allowBuilds:
  esbuild: true
  msw: false
  sharp: false
  workerd: true
