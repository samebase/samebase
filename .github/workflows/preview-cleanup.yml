# Deletes the Convex preview deployment of a closed pull request, so a closed pull request holds
# none of the team's deployment quota. No checkout or install: a broken install must not keep the
# preview.
name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete preview
    # A pull request from a fork got no preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # The action notes the delete in the preview's comment.
    # The preview's own group, so the delete waits for a running deploy of the branch instead of
    # deleting the preview under it.
    concurrency:
      group: preview-${{ github.head_ref }}
      queue: max

    steps:
      - name: Delete the preview
        uses: samebase/convex-hosting/actions/cleanup@ceb6259a5fa3292bdbf05675a48327ec7b9cffa6 # v1.2.1
        with:
          deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          working-directory: apps/samebase
