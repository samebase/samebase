name: Starter template supply-chain

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    defaults:
      run:
        working-directory: templates/app

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: templates/app/pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical
