name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true

permissions:
  contents: read

jobs:
  playwright:
    name: playwright
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@22ff2ea5697369864347140857d218e42815b33c # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit package signatures
        run: pnpm audit signatures
      - name: Audit known vulnerabilities
        run: pnpm audit
      - name: Reset script-disabled install
        run: rm -rf node_modules
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts --keep-running
      - name: Build Samebase preview
        run: PLAYWRIGHT=1 pnpm --filter samebase build:ci
      - name: Install Playwright browser
        run: pnpm --filter samebase exec playwright install --with-deps chromium
      - name: Run Testbox
        uses: useblacksmith/run-testbox@9b976c32aa3bcbffb348889673585a5deee1b2f3 # v2
        if: always()
