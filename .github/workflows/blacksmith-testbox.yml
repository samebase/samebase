name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true

permissions:
  contents: read

jobs:
  playwright:
    name: playwright
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit package signatures
        run: pnpm audit signatures
      - name: Audit known vulnerabilities
        run: pnpm audit
      - name: Reset script-disabled install
        run: rm -rf node_modules
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts --keep-running
      - name: Build Samebase preview
        run: PLAYWRIGHT=1 pnpm --filter samebase build:ci
      - name: Install Playwright browser
        run: pnpm --filter samebase exec playwright install --with-deps chromium
      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
