# Each week, lists the resource types of the latest alchemy on npm that have no entry in
# packages/alchemy-kit/scripts/ui/resourceTypes.input.ts, in one open issue. The pull request check
# runs the same script against the pinned alchemy version.
name: Alchemy resource types

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: alchemy-resource-types
  cancel-in-progress: false

jobs:
  new-types:
    name: List new resource types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: New Alchemy resource types
        run: |
          version=$(npm view alchemy version)
          missing="$RUNNER_TEMP/missing.md"
          status=0
          node packages/alchemy-kit/scripts/ui/check.ts --alchemy "$version" > "$missing" || status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ ! -s "$missing" ]; then exit "$status"; fi
          body="$RUNNER_TEMP/body.md"
          {
            echo "alchemy $version declares these resource types, which have no entry. Add each to [resourceTypes.input.ts](https://github.com/$GH_REPO/blob/main/packages/alchemy-kit/scripts/ui/resourceTypes.input.ts) and run \`pnpm --filter @samebase/alchemy-kit run ui:generate\`."
            echo
            cat "$missing"
          } > "$body"
          number=$(gh issue list --state open --limit 1000 --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
