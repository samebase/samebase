name: Sync SSR Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ssr-branch
  cancel-in-progress: false

jobs:
  sync:
    name: sync ssr
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The branch comparison below needs the merge base between main and ssr.
          fetch-depth: 0

      - name: Configure Git committer
        run: |
          # Git needs a committer identity for the rebased SSR config commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebuild SSR branch from main
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/ssr:refs/remotes/origin/ssr

          old_ssr_head="$(git rev-parse origin/ssr)"
          ssr_unique_commits="$(git rev-list --reverse origin/main..origin/ssr)"
          ssr_unique_count="$(printf "%s\n" "$ssr_unique_commits" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$ssr_unique_count" != "1" ]; then
            echo "::error::origin/ssr must have exactly one commit that is not already on origin/main."
            echo "The range origin/main..origin/ssr only counts commits unique to ssr, so this does not fail merely because main moved forward."
            echo "Actual unique SSR commit count: $ssr_unique_count"
            exit 1
          fi

          ssr_config_commit="$(printf "%s\n" "$ssr_unique_commits" | sed -n '1p')"
          git switch --detach origin/main
          git cherry-pick "$ssr_config_commit"

          prepared_count="$(git rev-list --count origin/main..HEAD)"
          if [ "$prepared_count" != "1" ]; then
            echo "::error::Prepared SSR branch must be exactly one commit ahead of origin/main."
            echo "Actual prepared unique commit count: $prepared_count"
            exit 1
          fi

          expected_files="$(
            printf "%s\n" \
              apps/samebase/vite.config.ts \
              apps/samebase/wrangler.jsonc
          )"
          actual_files="$(git diff --name-only origin/main..HEAD | sort)"

          if [ "$actual_files" != "$expected_files" ]; then
            echo "::error::origin/ssr must stay a config-only branch."
            echo "Expected changed files:"
            printf "%s\n" "$expected_files"
            echo "Actual changed files:"
            printf "%s\n" "$actual_files"
            exit 1
          fi

          git push --force-with-lease=refs/heads/ssr:"$old_ssr_head" origin HEAD:refs/heads/ssr
