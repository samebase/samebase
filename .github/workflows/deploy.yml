# Deploys samebase.com: every push to main builds the site and uploads it to the production Convex
# deployment through convex-hosting, which serves it after the HTTP routes of convex/http.ts.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://samebase.com
    # One deploy at a time. Pending runs wait in order, so a re-run of an old commit never replaces
    # the newest run, and the action refuses to deploy a commit that is not the head of main.
    concurrency:
      group: production
      queue: max

    steps:
      # Full history: the build reads the commit count for the version label
      # (apps/samebase/dev/appBuildMetadata.ts), and without credentials it cannot unshallow itself.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the deploy script of apps/samebase/package.json. The build inside it reads these
      # variables: the production route environment, the prerender origin, and the first-party
      # PostHog proxy with the project token from the repository variable.
      - name: Deploy
        id: deploy
        uses: samebase/convex-hosting/actions/deploy@ceb6259a5fa3292bdbf05675a48327ec7b9cffa6 # v1.2.1
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          working-directory: apps/samebase
        env:
          VITE_SAMEBASE_ROUTE_ENVIRONMENT: production
          SAMEBASE_PRERENDER_ORIGIN: https://samebase.com
          VITE_PUBLIC_POSTHOG_HOST: https://e.samebase.com
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PROD_POSTHOG_PROJECT_TOKEN }}
