name: Daytona deps image

on:
  push:
    paths:
      - pnpm-lock.yaml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute pnpm lock hash
        id: lock
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push deps image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.daytona-deps
          push: true
          build-args: |
            WORKSPACE_DIR=/home/daytona/workspace
            REPO_NAME=${{ github.event.repository.name }}
            PNPM_VERSION=9.15.0
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-daytona-deps:${{ steps.lock.outputs.hash }}
