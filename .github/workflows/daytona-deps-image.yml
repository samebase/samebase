name: Daytona deps image

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/noter/package.json
      - apps/noter-starter-template/package.json
      - Dockerfile.daytona-deps
      - scripts/daytona-deps-hash.js
      - .github/workflows/daytona-deps-image.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/noter/package.json
      - apps/noter-starter-template/package.json
      - Dockerfile.daytona-deps
      - scripts/daytona-deps-hash.js
      - .github/workflows/daytona-deps-image.yml
  workflow_dispatch: {}

concurrency:
  group: daytona-deps-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAYTONA_PNPM_VERSION: '9.15.0'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide publish mode
        id: publish
        run: |
          should_push="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            should_push="true"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            should_push="true"
          fi
          echo "should_push=${should_push}" >> "$GITHUB_OUTPUT"

          publish_aliases="false"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            publish_aliases="true"
          fi
          echo "publish_aliases=${publish_aliases}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.publish.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image
        id: base_image
        env:
          DAYTONA_BASE_IMAGE_OVERRIDE: ${{ vars.DAYTONA_BASE_IMAGE }}
        run: |
          base_image="${DAYTONA_BASE_IMAGE_OVERRIDE}"
          if [ -z "$base_image" ]; then
            base_image="mcr.microsoft.com/devcontainers/javascript-node:24-bookworm"
          fi
          echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"

      - name: Compute deps hashes
        id: hash
        env:
          DAYTONA_BASE_IMAGE: ${{ steps.base_image.outputs.base_image }}
          DAYTONA_PNPM_VERSION: ${{ env.DAYTONA_PNPM_VERSION }}
        run: node scripts/daytona-deps-hash.js

      - name: Resolve image tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-daytona-deps"
          immutable_tag="${image}:${{ steps.hash.outputs.input_hash }}"
          lock_tag="${image}:deps-lock-${{ steps.hash.outputs.lock_hash }}"
          legacy_lock_tag="${image}:${{ steps.hash.outputs.lock_hash }}"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${immutable_tag}" >> "$GITHUB_OUTPUT"
          echo "lock_tag=${lock_tag}" >> "$GITHUB_OUTPUT"
          echo "legacy_lock_tag=${legacy_lock_tag}" >> "$GITHUB_OUTPUT"

      - name: Check immutable tag
        if: steps.publish.outputs.should_push == 'true'
        id: existing
        run: |
          if docker buildx imagetools inspect "${{ steps.tags.outputs.immutable_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push immutable deps image
        if:
          steps.publish.outputs.should_push == 'true' &&
          steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.daytona-deps
          push: true
          cache-from: type=gha,scope=daytona-deps-${{ github.repository }}
          cache-to:
            type=gha,mode=max,scope=daytona-deps-${{ github.repository }}
          build-args: |
            BASE_IMAGE=${{ steps.base_image.outputs.base_image }}
            WORKSPACE_DIR=/home/daytona/workspace
            REPO_NAME=${{ github.event.repository.name }}
            PNPM_VERSION=${{ env.DAYTONA_PNPM_VERSION }}
          tags: ${{ steps.tags.outputs.immutable_tag }}

      - name: Build deps image (no push)
        if: steps.publish.outputs.should_push != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.daytona-deps
          push: false
          cache-from: type=gha,scope=daytona-deps-${{ github.repository }}
          build-args: |
            BASE_IMAGE=${{ steps.base_image.outputs.base_image }}
            WORKSPACE_DIR=/home/daytona/workspace
            REPO_NAME=${{ github.event.repository.name }}
            PNPM_VERSION=${{ env.DAYTONA_PNPM_VERSION }}

      - name: Publish lock aliases on main
        if: steps.publish.outputs.publish_aliases == 'true'
        run: |
          immutable="${{ steps.tags.outputs.immutable_tag }}"
          lock_alias="${{ steps.tags.outputs.lock_tag }}"
          legacy_alias="${{ steps.tags.outputs.legacy_lock_tag }}"

          tags=()
          for tag in "$lock_alias" "$legacy_alias"; do
            if [ -z "$tag" ] || [ "$tag" = "$immutable" ]; then
              continue
            fi
            duplicate="false"
            for existing in "${tags[@]}"; do
              if [ "$existing" = "$tag" ]; then
                duplicate="true"
                break
              fi
            done
            if [ "$duplicate" = "false" ]; then
              tags+=("$tag")
            fi
          done

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No alias tags to publish."
            exit 0
          fi

          command=(docker buildx imagetools create)
          for tag in "${tags[@]}"; do
            command+=(-t "$tag")
          done
          command+=("$immutable")
          "${command[@]}"
