# Publishes @samebase/alchemy-convex when the version in its package.json is not on npm yet, with
# provenance through npm trusted publishing. The npm trusted publisher of the package names this
# file. The tag <name>@<version> records a published version. A merge that bumps no version publishes
# nothing.
name: alchemy-convex release

on:
  push:
    branches: [main]
    paths:
      - "packages/alchemy-convex/package.json"

concurrency:
  group: alchemy-convex-release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_DIR: packages/alchemy-convex
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Read the package version
        id: version
        run: |
          name=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          version=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          tag="$name@$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if npm view "$tag" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already on npm; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The whole workspace: the lint and the tests load the root Vite+ config.
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check the package
        if: steps.version.outputs.publish == 'true'
        run: pnpm --filter @samebase/alchemy-convex run check

      # pnpm pack replaces catalog: versions with real ones, and prepack builds.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        run: |
          tarball=$(cd "$PACKAGE_DIR" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          pnpm --filter @samebase/alchemy-convex exec publint "$tarball"
          npx --yes npm@11.21.0 publish "$tarball" --access public --provenance

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
