name: Public media availability

on:
  pull_request:
    paths:
      - ".github/workflows/public-media.yml"
      - "apps/samebase/shared/publicMediaManifest.ts"
      - "package.json"
      - "scripts/check-public-media.test.ts"
      - "scripts/check-public-media.ts"
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check public media
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          check-latest: true

      - name: Check public media
        run: node ./scripts/check-public-media.ts
