name: Public media availability

on:
  pull_request:
    paths:
      - ".github/workflows/public-media.yml"
      - "apps/samebase/shared/publicMediaManifest.ts"
      - "package.json"
      - "scripts/check-public-media.test.ts"
      - "scripts/check-public-media.ts"
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check public media
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Check public media
        run: node ./scripts/check-public-media.ts
