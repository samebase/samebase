# Deploys each pull request to the Convex preview deployment named after its branch, through
# convex-hosting. A second push reuses the preview. preview-cleanup.yml deletes it on close.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    name: Deploy preview
    # A pull request from a fork gets no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # The action keeps one comment with the preview's links.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    # One run per branch. Pending runs wait in order, so a re-run of an old commit never replaces
    # the newest run, and the action refuses to deploy a commit that is not the head of the branch.
    concurrency:
      group: preview-${{ github.head_ref }}
      queue: max

    steps:
      # The branch head, not the default merge commit: the preview is the branch, and the action
      # compares the checkout with the branch head.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the deploy script of apps/samebase/package.json with --preview-name <branch>. Without
      # the secret, the action deploys nothing and the steps below are skipped.
      - name: Deploy the preview
        id: deploy
        uses: samebase/convex-hosting/actions/preview@ceb6259a5fa3292bdbf05675a48327ec7b9cffa6 # v1.2.1
        with:
          deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          working-directory: apps/samebase
        env:
          VITE_SAMEBASE_ROUTE_ENVIRONMENT: preview

      # Convex Auth builds its redirects from SITE_URL, so the preview signs in on its own origin.
      - name: Set SITE_URL to the preview URL
        if: steps.deploy.outputs.preview-name
        working-directory: apps/samebase
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PREVIEW: ${{ steps.deploy.outputs.preview-name }}
          URL: ${{ steps.deploy.outputs.url }}
        run: pnpm exec convex env set SITE_URL "$URL" --preview-name "$PREVIEW"

      # The preview's password account, from the DEV_SEED_AUTH_* values of the project's default
      # environment variables.
      - name: Seed the password account
        if: steps.deploy.outputs.preview-name
        working-directory: apps/samebase
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PREVIEW: ${{ steps.deploy.outputs.preview-name }}
        run: pnpm exec convex run devAuth:seedPasswordAccount --preview-name "$PREVIEW"
