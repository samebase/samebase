# Runs the setup stack in apps/samebase/alchemy.run.ts, from apps/samebase.
# .github/workflows/deploy.yml deploys samebase.com itself, to its Convex
# deployment through convex-hosting; this workflow deploys the Workers around
# it that the stack declares: the PostHog proxy on e.samebase.com and the
# domain router on json.md and xml.md.
#
# Pull request: a plan, read-only, as a check. Push to main: a deploy. Both
# compare against the live account (--detect-drift), so a changed route or
# setting is repaired, not only a changed run file. The state is Alchemy's
# Cloudflare state store.
name: infra

on:
  pull_request:
    paths:
      - apps/samebase/alchemy.run.ts
      - apps/samebase/package.json
      - apps/posthog-proxy/src/**
      - apps/posthog-proxy/package.json
      - apps/domain-router/src/**
      - apps/domain-router/package.json
      - pnpm-lock.yaml
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - apps/samebase/alchemy.run.ts
      - apps/samebase/package.json
      - apps/posthog-proxy/src/**
      - apps/posthog-proxy/package.json
      - apps/domain-router/src/**
      - apps/domain-router/package.json
      - pnpm-lock.yaml
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      adopt:
        description: Adopt resources that exist but are not in state yet
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time. Pending runs wait instead of replacing each other, so a
# pull request plan never drops a queued deploy.
concurrency:
  group: infra
  queue: max
  cancel-in-progress: false

env:
  CI: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
  # The stack reads the GitHub ids of this repository from the GitHub API.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  plan:
    # Forks get no secrets, so the authenticated plan cannot run for them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx alchemy plan --stage prod --adopt --no-input --detailed
        working-directory: apps/samebase
      # Read-only: reports resources that changed outside the stack.
      - run: npx alchemy drift --stage prod --no-input
        working-directory: apps/samebase

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx alchemy deploy --stage prod --yes --no-input --detect-drift $ADOPT
        working-directory: apps/samebase
        env:
          # The workflow_dispatch input. Empty on a push to main.
          ADOPT: ${{ inputs.adopt && '--adopt' || '' }}
