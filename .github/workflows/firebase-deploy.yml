name: Deploy Firebase Lumina

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/firebase_lumina/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/firebase_lumina/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/firebase_lumina/package-lock.json'

      - name: Install dependencies
        run: |
          cd apps/firebase_lumina
          npm ci

      - name: Build project
        run: |
          cd apps/firebase_lumina
          npm run build

      - name: Deploy to Firebase Hosting (Preview)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMINA3334 }}
          projectId: lumina3334
          entryPoint: './apps/firebase_lumina'

      - name: Deploy to Firebase Hosting (Production)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMINA3334 }}
          projectId: lumina3334
          channelId: live
          entryPoint: './apps/firebase_lumina'
