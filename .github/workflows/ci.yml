name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]

permissions:
  contents: read

jobs:
  supply_chain:
    name: supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit known vulnerabilities
        run: pnpm audit

  checks:
    name: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: supply_chain

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Validate main build label
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ./scripts/validate-main-build-label.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `check:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts

      - name: Run checks
        run: pnpm check:ci

      - name: Run unit tests
        run: pnpm test

  playwright:
    name: playwright (${{ matrix.shard }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: supply_chain
    # Keep heavy browser coverage off PRs for now so branch validation stays
    # within the org Actions budget. Main pushes still exercise the full matrix.
    if: ${{ github.event_name == 'push' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24.x
            shard: 1/3
            shard_label: 1-3
          - node-version: 24.x
            shard: 2/3
            shard_label: 2-3
          - node-version: 24.x
            shard: 3/3
            shard_label: 3-3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `check:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts --keep-running

      - name: Build Samebase preview
        run: PLAYWRIGHT=1 pnpm --filter samebase build:ci

      - name: Install Playwright browser
        run: pnpm --filter samebase exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run:
          PLAYWRIGHT_SKIP_BUILD=1 PLAYWRIGHT_VITE_PORT=43121 pnpm --filter samebase exec playwright
          test -c playwright.config.ts --shard=${{ matrix.shard }}

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name:
            playwright-failure-artifacts-node-${{ matrix.node-version }}-shard-${{
            matrix.shard_label }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/samebase/e2e/playwright-report
            apps/samebase/e2e/test-results

  sync-windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    needs: supply_chain
    # Keep Windows smoke coverage off PRs for now so branch validation stays
    # within the org Actions budget. Main pushes still exercise the full matrix.
    if: ${{ github.event_name == 'push' }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync smoke tests on Windows
        run:
          pnpm exec vp test run packages/sync/samebase.test.ts
          apps/samebase/src/lib/samebaseSyncPublicScript.test.ts

      - name: Run anonymous predev smoke on Windows
        working-directory: apps/samebase
        env:
          CONVEX_AGENT_MODE: anonymous
        run: node ./scripts/predev.ts

      - name: Run Vite wrapper smoke on Windows
        working-directory: apps/samebase
        run: node ./scripts/run-vite-dev.ts --version

  ci:
    name: ci (24.x)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [supply_chain, checks, playwright, sync-windows]
    if: ${{ always() }}

    steps:
      # Keep the historical required check name stable while the real work runs
      # in parallel jobs underneath it.
      - name: Aggregate parallel CI results
        run: |
          if [ "${{ needs.supply_chain.result }}" != "success" ]; then
            echo "supply-chain: ${{ needs.supply_chain.result }}"
            exit 1
          fi

          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.playwright.result }}" != "success" ] || [ "${{ needs.sync-windows.result }}" != "success" ]; then
              echo "playwright: ${{ needs.playwright.result }}"
              echo "sync-windows: ${{ needs.sync-windows.result }}"
              exit 1
            fi
          else
            echo "playwright: ${{ needs.playwright.result }}"
            echo "sync-windows: ${{ needs.sync-windows.result }}"
            echo "Heavy jobs are intentionally skipped on pull requests."
          fi
