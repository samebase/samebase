name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]
  # The nightly run covers what a pull request can skip: new advisories for dependencies that did
  # not change, a new Node release, and the Windows smoke.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the jobs that depend on changed files. The checks, unit tests, and app build run on every
  # event. A job that runs dependency code waits for the audit only when the audit is selected, so the
  # audit runs first when a dependency changes and costs a pull request nothing when none does.
  changes:
    name: changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      dependencies:
        ${{ steps.filter.outcome != 'success' || steps.filter.outputs.dependencies == 'true' }}
      templates:
        ${{ steps.filter.outcome != 'success' || steps.filter.outputs.templates == 'true' }}
      windows_launcher:
        ${{ steps.filter.outcome != 'success' || steps.filter.outputs.windows_launcher == 'true' }}
      windows_smoke:
        ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        steps.filter.outputs.windows_smoke == 'true' }}

    steps:
      # GitHub lists at most 3000 changed files. A larger pull request selects every job.
      - name: Select jobs
        id: filter
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dependencies:
              - .github/workflows/ci.yml
              - .nvmrc
              - package.json
              - apps/**/package.json
              - packages/**/package.json
              - patches/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            templates:
              - .github/workflows/ci.yml
              - templates/**
            windows_launcher:
              - .github/workflows/ci.yml
              - .nvmrc
              - package.json
              - apps/samebase/package.json
              - apps/samebase/scripts/convex-local-utils.ts
              - apps/samebase/scripts/normalizeEnvValue.ts
              - apps/samebase/scripts/run-vite-dev.ts
              - packages/dependent/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - templates/base/package.json
              - templates/base/pnpm-lock.yaml
              - templates/base/scripts/**
            windows_smoke:
              - apps/samebase/scripts/convex-dev.ts
              - apps/samebase/scripts/convex-local-utils.ts
              - apps/samebase/scripts/localConvexAdminClient.ts
              - apps/samebase/scripts/normalizeEnvValue.ts
              - apps/samebase/scripts/predev.ts
              - apps/samebase/scripts/seed-local-password-account.ts
              - runtime/anonymousLocalPorts.ts
              - scripts/ci-bootstrap-convex.ts
              - scripts/ci-windows-start.ts
              - scripts/lib/convexAuthKeys.ts
              - templates/base/scripts/**

  # A pull request audits only when it changes dependencies: a new advisory for an unchanged
  # dependency is already on main, and the nightly run reports it.
  supply_chain:
    name: supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit known vulnerabilities
        run: pnpm audit

  starter_template_supply_chain:
    name: starter template supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.templates == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        template: [base, base-actions]

    defaults:
      run:
        working-directory: templates/${{ matrix.template }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: templates/${{ matrix.template }}/package.json
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: templates/${{ matrix.template }}/pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

  starter_template_check:
    name: starter template check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [changes, starter_template_supply_chain]
    if: ${{ needs.changes.outputs.templates == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        template: [base, base-actions]

    defaults:
      run:
        working-directory: templates/${{ matrix.template }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: templates/${{ matrix.template }}/package.json
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: templates/${{ matrix.template }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the template build
        env:
          VITE_CONVEX_URL: http://127.0.0.1:3210
        run: pnpm run build

  checks:
    name: checks
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: [changes, supply_chain]
    if:
      ${{ !cancelled() && needs.changes.result == 'success' && (needs.supply_chain.result ==
      'success' || needs.supply_chain.result == 'skipped') }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "pnpm"

      - name: Validate main build label
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ./scripts/validate-main-build-label.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Samebase plugin version for pull request
        if: github.event_name == 'pull_request'
        run: node ./scripts/check-agent-plugin-version.ts ${{ github.event.pull_request.base.sha }}

      - name: Validate Samebase plugin version for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ./scripts/check-agent-plugin-version.ts --latest-plugin-change

      - name: Run checks
        run: pnpm check:ci

  unit_tests:
    name: unit tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: [changes, supply_chain]
    if:
      ${{ !cancelled() && needs.changes.result == 'success' && (needs.supply_chain.result ==
      'success' || needs.supply_chain.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app imports the built package.
      - name: Build the sidebars package
        run: pnpm --filter @samebase/sidebars run build

      - name: Run unit tests
        run: pnpm test

  app_build:
    name: app build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: [changes, supply_chain]
    if:
      ${{ !cancelled() && needs.changes.result == 'success' && (needs.supply_chain.result ==
      'success' || needs.supply_chain.result == 'skipped') }}

    steps:
      # Full commit history: the build reads the commit count for the version label.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves that the app builds and that its Convex functions push to a backend.
      # The first push needs .convex-hosting/version.js, which only a deploy
      # writes, and the server build dist/server/server.js, so the bootstrap
      # runs one `deploy --dev` (a site build and upload to the local backend)
      # before it waits for the functions.
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts

  playwright:
    name: playwright (${{ matrix.shard }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: supply_chain
    # Keep heavy browser coverage off PRs for now so branch validation stays
    # within the org Actions budget. Main pushes still exercise the full matrix.
    if: ${{ github.event_name == 'push' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24.x
            shard: 1/3
            shard_label: 1-3
          - node-version: 24.x
            shard: 2/3
            shard_label: 2-3
          - node-version: 24.x
            shard: 3/3
            shard_label: 3-3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `check:ci`/`build:ci` skip Convex codegen and rely on this step.
      # The first push needs .convex-hosting/version.js, which only a deploy
      # writes, and the server build dist/server/server.js, so the bootstrap
      # runs one `deploy --dev` (a site build and upload to the local backend)
      # before it waits for the functions.
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts --keep-running

      - name: Build Samebase preview
        run: PLAYWRIGHT=1 pnpm --filter samebase build:ci

      - name: Install Playwright browser
        run: pnpm --filter samebase exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run:
          PLAYWRIGHT_SKIP_BUILD=1 PLAYWRIGHT_VITE_PORT=43121 pnpm --filter samebase exec playwright
          test -c playwright.config.ts --shard=${{ matrix.shard }}

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name:
            playwright-failure-artifacts-node-${{ matrix.node-version }}-shard-${{
            matrix.shard_label }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/samebase/e2e/playwright-report
            apps/samebase/e2e/test-results

  # The launcher checks are the Windows-only contract of a pull request. They run when the launchers
  # or the dependencies that choose their executables change.
  windows_launcher:
    name: windows launcher
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    needs: [changes, supply_chain, starter_template_supply_chain]
    if:
      ${{ !cancelled() && needs.changes.outputs.windows_launcher == 'true' &&
      (needs.supply_chain.result == 'success' || needs.supply_chain.result == 'skipped') &&
      (needs.starter_template_supply_chain.result == 'success' ||
      needs.starter_template_supply_chain.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install starter template dependencies
        working-directory: templates/base
        run: pnpm install --frozen-lockfile

      # This is a finite process-launch smoke, not a server readiness check.
      # `--help` exercises the Windows Vite+ resolution and spawn path, then exits.
      - name: Verify Vite+ launcher on Windows
        working-directory: apps/samebase
        run: node ./scripts/run-vite-dev.ts --help

      # `--help` keeps the process finite while Convex still parses the full
      # `--start` value that launches auth setup and the frontend together.
      - name: Verify starter template launcher on Windows
        working-directory: templates/base
        run: pnpm run dev --help

      - name: Verify starter template worktree detection on Windows
        working-directory: templates/base
        run: pnpm exec vp test scripts/run-context-dev.test.ts

      # Worktree mode sets anonymous Convex mode before it enters the same launcher.
      - name: Verify starter template worktree launcher on Windows
        working-directory: templates/base
        run: pnpm run dev:worktree --help

  # Runs nightly, and on a pull request that changes startup code. Linux fails with the same app build
  # errors, so an ordinary app change does not need it.
  windows-smoke:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    needs: [changes, supply_chain, starter_template_supply_chain]
    if:
      ${{ !cancelled() && needs.changes.outputs.windows_smoke == 'true' &&
      (needs.supply_chain.result == 'success' || needs.supply_chain.result == 'skipped') &&
      (needs.starter_template_supply_chain.result == 'success' ||
      needs.starter_template_supply_chain.result == 'skipped') }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install starter template dependencies
        working-directory: templates/base
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Convex for Windows predev
        run: node ./scripts/ci-bootstrap-convex.ts

      - name: Run anonymous predev smoke on Windows
        working-directory: apps/samebase
        env:
          CONVEX_AGENT_MODE: anonymous
        run: node ./scripts/predev.ts

      - name: Start the starter template and load a page on Windows
        working-directory: templates/base
        run: node ../../scripts/ci-windows-start.ts

  ci:
    name: ci (24.x)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      [
        changes,
        supply_chain,
        starter_template_supply_chain,
        starter_template_check,
        checks,
        unit_tests,
        app_build,
        playwright,
        windows_launcher,
        windows-smoke,
      ]
    if: ${{ always() }}

    steps:
      # Keep the historical required check name stable while the real work runs
      # in parallel jobs underneath it. A selected job must succeed, and a job
      # that was not selected must skip.
      - name: Aggregate parallel CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          SELECT_DEPENDENCIES: ${{ needs.changes.outputs.dependencies }}
          SELECT_TEMPLATES: ${{ needs.changes.outputs.templates }}
          SELECT_WINDOWS_LAUNCHER: ${{ needs.changes.outputs.windows_launcher }}
          SELECT_WINDOWS_SMOKE: ${{ needs.changes.outputs.windows_smoke }}
          SUPPLY_CHAIN: ${{ needs.supply_chain.result }}
          STARTER_TEMPLATE_SUPPLY_CHAIN: ${{ needs.starter_template_supply_chain.result }}
          STARTER_TEMPLATE_CHECK: ${{ needs.starter_template_check.result }}
          CHECKS: ${{ needs.checks.result }}
          UNIT_TESTS: ${{ needs.unit_tests.result }}
          APP_BUILD: ${{ needs.app_build.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          WINDOWS_LAUNCHER: ${{ needs.windows_launcher.result }}
          WINDOWS_SMOKE: ${{ needs.windows-smoke.result }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "$1: $2"
              exit 1
            fi
          }

          require_selected() {
            case "$3" in
              true)
                require_success "$1" "$2"
                ;;
              false)
                if [ "$2" != "skipped" ]; then
                  echo "$1: $2, but the job was not selected"
                  exit 1
                fi
                ;;
              *)
                echo "$1: the selection is '$3'"
                exit 1
                ;;
            esac
          }

          require_success "changes" "$CHANGES"
          require_selected "supply-chain" "$SUPPLY_CHAIN" "$SELECT_DEPENDENCIES"
          require_success "checks" "$CHECKS"
          require_success "unit tests" "$UNIT_TESTS"
          require_success "app build" "$APP_BUILD"
          require_selected "starter template supply-chain" "$STARTER_TEMPLATE_SUPPLY_CHAIN" "$SELECT_TEMPLATES"
          require_selected "starter template check" "$STARTER_TEMPLATE_CHECK" "$SELECT_TEMPLATES"
          require_selected "windows launcher" "$WINDOWS_LAUNCHER" "$SELECT_WINDOWS_LAUNCHER"
          require_selected "windows-smoke" "$WINDOWS_SMOKE" "$SELECT_WINDOWS_SMOKE"

          if [ "$EVENT_NAME" = "push" ]; then
            require_success "playwright" "$PLAYWRIGHT"
          else
            echo "playwright: $PLAYWRIGHT"
            echo "Playwright is intentionally skipped on pull requests."
          fi

  publish_repository_exports:
    name: publish repository exports
    needs:
      [
        supply_chain,
        starter_template_supply_chain,
        starter_template_check,
        checks,
        unit_tests,
        app_build,
      ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: publish-repository-exports
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          check-latest: true

      - name: Read repository export targets
        id: repository-exports
        run: node ./scripts/publish-repository-exports.ts --write-target-repositories-output

      # GitHub refuses the publisher token below without naming a missing
      # target repository. This metadata-only token lets the next step name it.
      - name: Create repository lookup token
        id: lookup-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REPOSITORY_EXPORTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOSITORY_EXPORTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Check repository export targets
        env:
          REPOSITORY_EXPORTS_LOOKUP_TOKEN: ${{ steps.lookup-token.outputs.token }}
          TARGET_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node ./scripts/publish-repository-exports.ts --check-target-repositories

      - name: Create repository publisher token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REPOSITORY_EXPORTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOSITORY_EXPORTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repository-exports.outputs.repositories }}
          permission-contents: write
          permission-workflows: write

      - name: Publish repository exports
        env:
          REPOSITORY_EXPORTS_SOURCE_TOKEN: ${{ github.token }}
          REPOSITORY_EXPORTS_TARGET_TOKEN: ${{ steps.publisher-token.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node ./scripts/publish-repository-exports.ts
