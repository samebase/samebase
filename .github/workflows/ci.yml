name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `lint:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: ./scripts/ci-bootstrap-convex.sh

      - name: Type check
        run: pnpm lint:ci

      - name: Run unit tests
        run: pnpm test

      - name: Run Cloudflare Pages routing smoke
        run: node scripts/check-cloudflare-pages-routing.mjs

  playwright:
    name: playwright (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep heavy browser coverage off PRs for now so branch validation stays
    # within the org Actions budget. Main pushes still exercise the full matrix.
    if: ${{ github.event_name == 'push' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24.x
            shard: 1/3
            shard_label: 1-3
          - node-version: 24.x
            shard: 2/3
            shard_label: 2-3
          - node-version: 24.x
            shard: 3/3
            shard_label: 3-3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `lint:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: ./scripts/ci-bootstrap-convex.sh

      - name: Build noter preview
        run: PLAYWRIGHT=1 pnpm --filter noter build:ci

      - name: Install Playwright browser
        run: pnpm --filter noter exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run:
          PLAYWRIGHT_SKIP_BUILD=1 PLAYWRIGHT_VITE_PORT=43121 pnpm --filter noter
          exec playwright test -c playwright.config.ts --shard=${{ matrix.shard
          }}

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name:
            playwright-failure-artifacts-node-${{ matrix.node-version
            }}-shard-${{ matrix.shard_label }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/noter/e2e/playwright-report
            apps/noter/e2e/test-results

  sync-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    # Keep Windows smoke coverage off PRs for now so branch validation stays
    # within the org Actions budget. Main pushes still exercise the full matrix.
    if: ${{ github.event_name == 'push' }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run sync smoke tests on Windows
        run:
          pnpm exec vitest run packages/sync/noter.test.ts
          apps/noter/src/lib/noterSyncPublicScript.test.ts

      - name: Run anonymous predev smoke on Windows
        working-directory: apps/noter
        env:
          CONVEX_AGENT_MODE: anonymous
        run: node predev.js

      - name: Run Vite wrapper smoke on Windows
        working-directory: apps/noter
        run: node scripts/run-vite-dev.js --version

  ci:
    name: ci (24.x)
    runs-on: ubuntu-latest
    needs: [checks, playwright, sync-windows]
    if: ${{ always() }}

    steps:
      # Keep the historical required check name stable while the real work runs
      # in parallel jobs underneath it.
      - name: Aggregate parallel CI results
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.playwright.result }}" != "success" ] || [ "${{ needs.sync-windows.result }}" != "success" ]; then
              echo "playwright: ${{ needs.playwright.result }}"
              echo "sync-windows: ${{ needs.sync-windows.result }}"
              exit 1
            fi
          else
            echo "playwright: ${{ needs.playwright.result }}"
            echo "sync-windows: ${{ needs.sync-windows.result }}"
            echo "Heavy jobs are intentionally skipped on pull requests."
          fi
