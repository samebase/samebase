name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]

permissions:
  contents: read

jobs:
  supply_chain:
    name: supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit known vulnerabilities
        run: pnpm audit

  starter_template_supply_chain:
    name: starter template supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        template: [base, base-actions]

    defaults:
      run:
        working-directory: templates/${{ matrix.template }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: templates/${{ matrix.template }}/package.json
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: templates/${{ matrix.template }}/pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

  starter_template_check:
    name: starter template check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: starter_template_supply_chain
    strategy:
      fail-fast: false
      matrix:
        template: [base, base-actions]

    defaults:
      run:
        working-directory: templates/${{ matrix.template }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: templates/${{ matrix.template }}/package.json
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: templates/${{ matrix.template }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the template build
        env:
          VITE_CONVEX_URL: http://127.0.0.1:3210
        run: pnpm run build

  sidebars_package_supply_chain:
    name: sidebars package supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/sidebars

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: packages/sidebars/package.json
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/sidebars/.node-version
          cache: "pnpm"
          cache-dependency-path: packages/sidebars/pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

  sidebars_package_check:
    name: sidebars package check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: sidebars_package_supply_chain

    defaults:
      run:
        working-directory: packages/sidebars

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: packages/sidebars/package.json
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/sidebars/.node-version
          cache: "pnpm"
          cache-dependency-path: packages/sidebars/pnpm-lock.yaml

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package checks
        run: pnpm check

  sidebars_example_supply_chain:
    name: sidebars example supply-chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/sidebars-example

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/sidebars-example/package.json
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/sidebars-example/.node-version
          cache: "pnpm"
          cache-dependency-path: apps/sidebars-example/pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

  sidebars_example_check:
    name: sidebars example check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: sidebars_example_supply_chain

    defaults:
      run:
        working-directory: apps/sidebars-example

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/sidebars-example/package.json
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/sidebars-example/.node-version
          cache: "pnpm"
          cache-dependency-path: apps/sidebars-example/pnpm-lock.yaml

      - name: Install example dependencies
        run: pnpm install --frozen-lockfile

      - name: Run example checks
        run: pnpm check

  checks:
    name: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: supply_chain

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Validate main build label
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ./scripts/validate-main-build-label.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Samebase plugin version for pull request
        if: github.event_name == 'pull_request'
        run: node ./scripts/check-agent-plugin-version.ts ${{ github.event.pull_request.base.sha }}

      - name: Validate Samebase plugin version for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ./scripts/check-agent-plugin-version.ts --latest-plugin-change

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `check:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts

      - name: Run checks
        run: pnpm check:ci

      - name: Run unit tests
        run: pnpm test

  playwright:
    name: playwright (${{ matrix.shard }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: supply_chain
    # Keep heavy browser coverage off PRs for now so branch validation stays
    # within the org Actions budget. Main pushes still exercise the full matrix.
    if: ${{ github.event_name == 'push' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24.x
            shard: 1/3
            shard_label: 1-3
          - node-version: 24.x
            shard: 2/3
            shard_label: 2-3
          - node-version: 24.x
            shard: 3/3
            shard_label: 3-3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `check:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: node ./scripts/ci-bootstrap-convex.ts --keep-running

      - name: Build Samebase preview
        run: PLAYWRIGHT=1 pnpm --filter samebase build:ci

      - name: Install Playwright browser
        run: pnpm --filter samebase exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run:
          PLAYWRIGHT_SKIP_BUILD=1 PLAYWRIGHT_VITE_PORT=43121 pnpm --filter samebase exec playwright
          test -c playwright.config.ts --shard=${{ matrix.shard }}

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name:
            playwright-failure-artifacts-node-${{ matrix.node-version }}-shard-${{
            matrix.shard_label }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/samebase/e2e/playwright-report
            apps/samebase/e2e/test-results

  windows-smoke:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    needs: supply_chain

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install starter template dependencies
        working-directory: templates/base
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Convex for Windows predev
        run: node ./scripts/ci-bootstrap-convex.ts

      - name: Run anonymous predev smoke on Windows
        working-directory: apps/samebase
        env:
          CONVEX_AGENT_MODE: anonymous
        run: node ./scripts/predev.ts

      # This is a finite process-launch smoke, not a server readiness check.
      # `--help` exercises the Windows Vite+ resolution and spawn path, then exits.
      - name: Verify Vite+ launcher on Windows
        working-directory: apps/samebase
        run: node ./scripts/run-vite-dev.ts --help

      # `--help` keeps the process finite while Convex still parses the full
      # `--start` value that launches auth setup and the frontend together.
      - name: Verify starter template launcher on Windows
        working-directory: templates/base
        run: pnpm run dev --help

      - name: Verify starter template worktree detection on Windows
        working-directory: templates/base
        run: pnpm exec vp test scripts/run-context-dev.test.ts

      # Worktree mode sets anonymous Convex mode before it enters the same launcher.
      - name: Verify starter template worktree launcher on Windows
        working-directory: templates/base
        run: pnpm run dev:worktree --help

  ci:
    name: ci (24.x)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      [
        supply_chain,
        sidebars_package_supply_chain,
        sidebars_package_check,
        sidebars_example_supply_chain,
        sidebars_example_check,
        starter_template_supply_chain,
        starter_template_check,
        checks,
        playwright,
        windows-smoke,
      ]
    if: ${{ always() }}

    steps:
      # Keep the historical required check name stable while the real work runs
      # in parallel jobs underneath it.
      - name: Aggregate parallel CI results
        run: |
          if [ "${{ needs.supply_chain.result }}" != "success" ]; then
            echo "supply-chain: ${{ needs.supply_chain.result }}"
            exit 1
          fi

          if [ "${{ needs.sidebars_package_supply_chain.result }}" != "success" ]; then
            echo "sidebars package supply-chain: ${{ needs.sidebars_package_supply_chain.result }}"
            exit 1
          fi

          if [ "${{ needs.sidebars_package_check.result }}" != "success" ]; then
            echo "sidebars package check: ${{ needs.sidebars_package_check.result }}"
            exit 1
          fi

          if [ "${{ needs.sidebars_example_supply_chain.result }}" != "success" ]; then
            echo "sidebars example supply-chain: ${{ needs.sidebars_example_supply_chain.result }}"
            exit 1
          fi

          if [ "${{ needs.sidebars_example_check.result }}" != "success" ]; then
            echo "sidebars example check: ${{ needs.sidebars_example_check.result }}"
            exit 1
          fi

          if [ "${{ needs.starter_template_supply_chain.result }}" != "success" ]; then
            echo "starter template supply-chain: ${{ needs.starter_template_supply_chain.result }}"
            exit 1
          fi

          if [ "${{ needs.starter_template_check.result }}" != "success" ]; then
            echo "starter template check: ${{ needs.starter_template_check.result }}"
            exit 1
          fi

          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}"
            exit 1
          fi

          if [ "${{ needs.windows-smoke.result }}" != "success" ]; then
            echo "windows-smoke: ${{ needs.windows-smoke.result }}"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.playwright.result }}" != "success" ]; then
              echo "playwright: ${{ needs.playwright.result }}"
              exit 1
            fi
          else
            echo "playwright: ${{ needs.playwright.result }}"
            echo "Playwright is intentionally skipped on pull requests."
          fi

  publish_repository_exports:
    name: publish repository exports
    needs:
      [
        checks,
        sidebars_package_supply_chain,
        sidebars_package_check,
        sidebars_example_supply_chain,
        sidebars_example_check,
        starter_template_check,
      ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: publish-repository-exports
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Read repository export targets
        id: repository-exports
        run: node ./scripts/publish-repository-exports.ts --write-target-repositories-output

      # GitHub refuses the publisher token below without naming a missing
      # target repository. This metadata-only token lets the next step name it.
      - name: Create repository lookup token
        id: lookup-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REPOSITORY_EXPORTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOSITORY_EXPORTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Check repository export targets
        env:
          REPOSITORY_EXPORTS_LOOKUP_TOKEN: ${{ steps.lookup-token.outputs.token }}
          TARGET_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node ./scripts/publish-repository-exports.ts --check-target-repositories

      - name: Create repository publisher token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REPOSITORY_EXPORTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOSITORY_EXPORTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repository-exports.outputs.repositories }}
          permission-contents: write
          permission-workflows: write

      - name: Publish repository exports
        env:
          REPOSITORY_EXPORTS_SOURCE_TOKEN: ${{ github.token }}
          REPOSITORY_EXPORTS_TARGET_TOKEN: ${{ steps.publisher-token.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node ./scripts/publish-repository-exports.ts
