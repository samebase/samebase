name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists before lint/build invoke `convex codegen`.
      # Note: bootstrap keeps Convex typecheck disabled; `pnpm lint` and
      # `pnpm build` still run the actual typecheck/codegen checks.
      - name: Bootstrap Convex for CI
        run: pnpm ci:convex-bootstrap

      - name: Type check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
