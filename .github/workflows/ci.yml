name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AUTH_GITHUB_ID: ci-placeholder
      AUTH_GITHUB_SECRET: ci-placeholder

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Seed Convex auth env for CI
        run: |
          {
            echo "AUTH_GITHUB_ID=ci-placeholder"
            echo "AUTH_GITHUB_SECRET=ci-placeholder"
          } >> apps/noter/.env.local

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `lint:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: pnpm ci:convex-bootstrap

      - name: Type check
        run: pnpm lint:ci

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build:ci
