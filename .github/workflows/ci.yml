name: CI

on:
  push:
    branches: [main, quantum-den]
  pull_request:
    branches: [main, quantum-den]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Bootstrap an anonymous local Convex deployment so CONVEX_DEPLOYMENT
      # exists and generated files are materialized for CI-only lint/build.
      # Note: `lint:ci`/`build:ci` skip Convex codegen and rely on this step.
      - name: Bootstrap Convex for CI
        run: |
          set -euo pipefail

          CONVEX_AGENT_MODE=anonymous pnpm --filter noter exec convex dev --until-success --typecheck=disable --tail-logs=disable > /tmp/convex-bootstrap.log 2>&1 &
          bootstrap_pid=$!

          # Fail fast if bootstrap exits immediately instead of waiting for timeouts.
          sleep 2
          if ! kill -0 "$bootstrap_pid" 2>/dev/null; then
            echo "Convex bootstrap exited early:"
            cat /tmp/convex-bootstrap.log
            exit 1
          fi

          timeout 60 bash -c 'until grep -q "^CONVEX_DEPLOYMENT=" apps/noter/.env.local 2>/dev/null; do sleep 1; done'
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:3210/instance_name >/dev/null; do sleep 1; done'

          pnpm --filter noter exec convex env set PROVIDER_GITHUB_OAUTH_CLIENT_ID ci-placeholder
          pnpm --filter noter exec convex env set PROVIDER_GITHUB_OAUTH_CLIENT_SECRET ci-placeholder
          pnpm --filter noter exec convex env set PROVIDER_GITHUB_OAUTH_REDIRECT_URL https://example.com/oauth/github/callback

          timeout 180 bash -c 'until grep -q "Convex functions ready!" /tmp/convex-bootstrap.log; do sleep 1; done'

          if kill -0 "$bootstrap_pid" 2>/dev/null; then
            kill "$bootstrap_pid" || true
            wait "$bootstrap_pid" || true
          fi
          tail -n 80 /tmp/convex-bootstrap.log

      - name: Type check
        run: pnpm lint:ci

      - name: Install Playwright browser
        run: pnpm --filter noter exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build:ci

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-node-${{ matrix.node-version }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/noter/e2e/playwright-report
            apps/noter/e2e/test-results

  sync-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run sync smoke tests on Windows
        run: pnpm exec vitest run packages/sync/noter.test.ts apps/noter/src/lib/noterSyncPublicScript.test.ts
