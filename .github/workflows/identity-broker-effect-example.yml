# Deploys the example app of the identity broker, the Alchemy stack in
# apps/identity-broker-effect-example/alchemy.run.ts: at the stage `prod` on a push to main, and at
# the stage `pr-<number>` of each pull request from this repository, when the push or the pull
# request changes the app, the broker, the hub client resource of packages/alchemy-convex (which
# the app takes from the workspace), or this file. It destroys a `pr-<number>` stage when its pull
# request closes. The app is a Worker that signs in with Google through the app's own hub
# (https://identity-broker-effect-example-hub-prod.pfp.workers.dev), which only `prod` deploys.
# Every stage's client registers on that one hub, with a key that `prod` makes (alchemy.run.ts).
#
# One deploy registers the client of a stage and gives the Worker its values. The smoke test then
# proves the registration: the page shows the sign-in link only with a client, and the hub sends
# the browser on to the provider only for a client that it knows. A preview that runs before `prod`
# made the hub's keys has no key and deploys with sign-in off; the smoke test says so and passes.
# `prod` must have its client.
#
# This file does not call alchemy-deploy.yml: the smoke test after the deploy is this app's own.
name: Identity broker example

on:
  push:
    branches: [main]
    paths: &paths
      - apps/identity-broker-effect-example/**
      - packages/identity-broker/**
      - packages/alchemy-convex/**
      - .github/workflows/identity-broker-effect-example.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: *paths

permissions:
  contents: read

env:
  STAGE:
    ${{ github.event_name == 'push' && 'prod' || format('pr-{0}', github.event.pull_request.number)
    }}
  # The Worker's workers.dev URL: its name from alchemy.run.ts on the account's subdomain.
  APP_URL:
    https://identity-broker-effect-example-${{ github.event_name == 'push' && 'prod' ||
    format('pr-{0}', github.event.pull_request.number) }}.pfp.workers.dev
  # The app's hub, src/hub.ts.
  HUB_ISSUER: https://identity-broker-effect-example-hub-prod.pfp.workers.dev

jobs:
  deploy:
    name: Deploy
    # A pull request from a fork gets no secrets for this repository.
    if: >-
      github.event_name == 'push' || (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run per stage at a time, in the same group as the other stacks of the stage: the state
    # store has no lock. A destroy waits for its running deploy. `prod` has the group of the
    # other stacks' `prod` (alchemy-deploy.yml).
    concurrency: &stage
      group:
        alchemy-${{ github.event.pull_request.number && format('pr-{0}',
        github.event.pull_request.number) || 'main' }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/identity-broker-effect-example

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # A re-run of an old run must not put older code over newer code. The job token lets git read
      # the repository; the deploy does not get it.
      - name: Check that the checkout is the head of the branch
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          head=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$head" ]; then
            echo "::error::The checkout is not the head of $BRANCH ($head). Nothing was deployed."
            exit 1
          fi

      # The hub client waits for the hub to answer discovery before it registers, so the run of
      # `prod` that deploys the hub registers its own client.
      - name: Deploy
        run: pnpm exec alchemy deploy --stage "$STAGE" --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # The hub's secrets (src/hub.ts), only for `prod`, the one stage that deploys the hub.
          EXAMPLE_HUB_GOOGLE_CLIENT_ID:
            ${{ github.event_name == 'push' && secrets.EXAMPLE_HUB_GOOGLE_CLIENT_ID || '' }}
          EXAMPLE_HUB_GOOGLE_CLIENT_SECRET:
            ${{ github.event_name == 'push' && secrets.EXAMPLE_HUB_GOOGLE_CLIENT_SECRET || '' }}
          IDENTITY_BROKER_KEYS:
            ${{ github.event_name == 'push' && secrets.EXAMPLE_HUB_IDENTITY_BROKER_KEYS || '' }}

      # A new workers.dev route answers error 1042 for about a minute, so each check is retried.
      # With a client, the page has the sign-in link, /login sends the browser to the hub, and the
      # hub sends it on to the provider. A preview without a client (no key before `prod` made the
      # keys) shows that sign-in is not configured and answers /login with 503: the step says so
      # and passes. `prod` must have its client.
      - name: Smoke test
        run: |
          deadline=$((SECONDS + 180))
          while :; do
            # `|| true`: a failed request is a retry, not the end of the step. The hub's answer is
            # read in the loop too: a hub deployed a minute ago can answer one request with 500.
            authorization_endpoint=$(curl -fsS --max-time 10 "$HUB_ISSUER/.well-known/openid-configuration" | jq -r .authorization_endpoint 2>/dev/null || true)
            page=$(curl -sS --max-time 10 "$APP_URL/" || true)
            home=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            link=$(printf '%s' "$page" | grep -Fc 'href="/login"' || true)
            off=$(printf '%s' "$page" | grep -Fc 'Sign-in is not configured.' || true)
            login=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$APP_URL/login" || true)
            location=$(curl -sS --max-time 10 -o /dev/null -w '%{redirect_url}' "$APP_URL/login" || true)
            # Where the hub sends the browser from there. A hub that does not know the client
            # answers 400, and an error answer goes back to the app.
            onward=no
            if [[ "$location" == "$authorization_endpoint?"* ]]; then
              next=$(curl -sS --max-time 10 -o /dev/null -w '%{redirect_url}' "$location" || true)
              if [ -n "$next" ] && [[ "$next" != "$APP_URL/"* ]]; then
                onward=yes
              fi
            fi
            if [ "$home" = 200 ] && [ "$link" -ge 1 ] && [ "$login" = 302 ] && [ "$onward" = yes ]; then
              echo "GET / is 200 with the sign-in link, GET /login sends the browser to the hub, and the hub sends it on to the provider."
              exit 0
            fi
            if [ "$STAGE" != prod ] && [ "$home" = 200 ] && [ "$off" -ge 1 ] && [ "$login" = 503 ]; then
              echo "::warning::$STAGE deployed with sign-in off: it has no client of the hub. A preview has no key until \`prod\` made the hub's keys; the deploy log above names any other reason."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              # Statuses only: each Location holds the sign-in's state and nonce.
              echo "::error::Smoke test failed after 180 seconds: GET / $home (sign-in links: $link, sign-in off: $off), GET /login $login, the hub sends the browser on to the provider: $onward."
              exit 1
            fi
            sleep 5
          done

  destroy:
    name: Destroy the preview
    # A pull request from a fork got no preview.
    if: >-
      github.event.action == 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: *stage
    defaults:
      run:
        working-directory: apps/identity-broker-effect-example

    steps:
      # The base branch, so a head whose install fails cannot keep the preview.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # The pull request that adds the stack: the base branch does not have it yet.
      - name: Checkout the head when the base has no stack
        if: hashFiles('apps/identity-broker-effect-example/alchemy.run.ts') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          check-latest: true
          cache: pnpm

      # No build: the destroy deletes the Worker and the hub client, and forgets the stage.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Destroy the preview
        run: |
          [[ "$STAGE" =~ ^pr-[0-9]+$ ]] || exit 1
          pnpm exec alchemy destroy --stage "$STAGE" --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
